<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bear Media - Links</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse-slow {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 0.2; }
        }

        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .pulse-slow {
            animation: pulse-slow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .link-item {
            transition: all 0.3s ease;
        }

        .link-item:hover {
            transform: translateY(-2px);
        }

        body {
            background: linear-gradient(135deg, #030712 0%, #0f172a 50%, #000000 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="text-white">
    <!-- Animated background blobs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-80 h-80 bg-blue-500/10 rounded-full blur-3xl pulse-slow"></div>
        <div class="absolute top-1/2 -left-40 w-80 h-80 bg-purple-500/10 rounded-full blur-3xl pulse-slow" style="animation-delay: 1s;"></div>
        <div class="absolute -bottom-40 right-1/3 w-80 h-80 bg-amber-500/5 rounded-full blur-3xl pulse-slow" style="animation-delay: 2s;"></div>
    </div>

    <!-- Main content -->
    <div class="relative z-10 flex flex-col items-center justify-center min-h-screen px-6 py-12">
        
        <!-- Header -->
        <div class="mb-16 text-center fade-in-up">
            <h1 class="text-5xl md:text-6xl font-bold mb-3 tracking-tight">
                Bear Media
            </h1>
            <div class="h-1 w-20 bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 mx-auto rounded-full mb-6"></div>
            <p class="text-gray-400 text-lg font-light">Creative services • Web • Video • Photography • AI</p>
        </div>

        <!-- Links container -->
        <div class="w-full max-w-md space-y-4 mb-12">
            
            <!-- Instagram -->
            <a href="https://instagram.com/bearmediacreative" target="_blank" rel="noopener noreferrer" class="group link-item block">
                <div class="relative bg-gray-800/50 backdrop-blur-xl border border-gray-700/50 hover:border-gray-600 rounded-xl p-4 flex items-center gap-4 transition-all duration-300">
                    <div class="text-3xl">📸</div>
                    <div class="flex-1">
                        <p class="font-semibold text-lg">Instagram</p>
                        <p class="text-gray-400 text-sm">Connect with us</p>
                    </div>
                    <svg class="w-5 h-5 text-gray-500 group-hover:text-white group-hover:translate-x-1 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </div>
            </a>

            <!-- TikTok -->
            <a href="https://tiktok.com/@bearmediacreative" target="_blank" rel="noopener noreferrer" class="group link-item block">
                <div class="relative bg-gray-800/50 backdrop-blur-xl border border-gray-700/50 hover:border-gray-600 rounded-xl p-4 flex items-center gap-4 transition-all duration-300">
                    <div class="text-3xl">🎵</div>
                    <div class="flex-1">
                        <p class="font-semibold text-lg">TikTok</p>
                        <p class="text-gray-400 text-sm">Connect with us</p>
                    </div>
                    <svg class="w-5 h-5 text-gray-500 group-hover:text-white group-hover:translate-x-1 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </div>
            </a>

            <!-- YouTube -->
            <a href="https://youtube.com/@bearmediacreative" target="_blank" rel="noopener noreferrer" class="group link-item block">
                <div class="relative bg-gray-800/50 backdrop-blur-xl border border-gray-700/50 hover:border-gray-600 rounded-xl p-4 flex items-center gap-4 transition-all duration-300">
                    <div class="text-3xl">▶️</div>
                    <div class="flex-1">
                        <p class="font-semibold text-lg">YouTube</p>
                        <p class="text-gray-400 text-sm">Connect with us</p>
                    </div>
                    <svg class="w-5 h-5 text-gray-500 group-hover:text-white group-hover:translate-x-1 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </div>
            </a>

            <!-- LinkedIn -->
            <a href="https://linkedin.com/company/bear-media" target="_blank" rel="noopener noreferrer" class="group link-item block">
                <div class="relative bg-gray-800/50 backdrop-blur-xl border border-gray-700/50 hover:border-gray-600 rounded-xl p-4 flex items-center gap-4 transition-all duration-300">
                    <div class="text-3xl">💼</div>
                    <div class="flex-1">
                        <p class="font-semibold text-lg">LinkedIn</p>
                        <p class="text-gray-400 text-sm">Connect with us</p>
                    </div>
                    <svg class="w-5 h-5 text-gray-500 group-hover:text-white group-hover:translate-x-1 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </div>
            </a>

            <!-- Facebook -->
            <a href="https://facebook.com/bearmediacreative" target="_blank" rel="noopener noreferrer" class="group link-item block">
                <div class="relative bg-gray-800/50 backdrop-blur-xl border border-gray-700/50 hover:border-gray-600 rounded-xl p-4 flex items-center gap-4 transition-all duration-300">
                    <div class="text-3xl">f</div>
                    <div class="flex-1">
                        <p class="font-semibold text-lg">Facebook</p>
                        <p class="text-gray-400 text-sm">Connect with us</p>
                    </div>
                    <svg class="w-5 h-5 text-gray-500 group-hover:text-white group-hover:translate-x-1 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </div>
            </a>

            <!-- Bear Media Website -->
            <a href="https://bear-media.com" target="_blank" rel="noopener noreferrer" class="group link-item block">
                <div class="relative bg-gray-800/50 backdrop-blur-xl border border-gray-700/50 hover:border-gray-600 rounded-xl p-4 flex items-center gap-4 transition-all duration-300">
                    <div class="text-3xl">🌐</div>
                    <div class="flex-1">
                        <p class="font-semibold text-lg">Bear Media</p>
                        <p class="text-gray-400 text-sm">Connect with us</p>
                    </div>
                    <svg class="w-5 h-5 text-gray-500 group-hover:text-white group-hover:translate-x-1 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </div>
            </a>

        </div>

        <!-- Footer -->
        <div class="text-center text-gray-500 text-sm mt-8">
            <p>© 2026 Bear Media. All links in one place.</p>
        </div>
    </div>

    <script>
        // Stagger animations on load
        const items = document.querySelectorAll('.link-item');
        items.forEach((item, index) => {
            item.style.animationDelay = `${0.1 + (index * 0.1)}s`;
            item.classList.add('fade-in-up');
        });
    </script>
</body>
</html>
