                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse-slow {
            0%, 100% { opacity: 0.08; }
            50% { opacity: 0.15; }
        }

        .fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;

        .pulse-slow {

        }

        .link-item {

        .link-item:active {
