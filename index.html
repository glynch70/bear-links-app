<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bear Media - Links</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse-slow {
            0%, 100% { opacity: 0.08; }
            50% { opacity: 0.15; }
        }

        .fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .pulse-slow {
            animation: pulse-slow 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        body {
            background: linear-gradient(135deg, #030712 0%, #0f172a 50%, #000000 100%);
            min-height: 100vh;
        }

        /* Flip container styles */
        .flip-link {
            perspective: 1000px;
            cursor: pointer;
        }

        .flip-inner {
            position: relative;
            width: 100%;
            height: 2.5rem;
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform-style: preserve-3d;
        }

        .flip-link:hover .flip-inner {
            transform: rotateX(90deg);
        }

        .flip-front, .flip-back {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.05em;
            backface-visibility: hidden;
        }

        .flip-front {
            color: white;
            z-index: 1;
        }

        .flip-back {
            color: #fbbf24;
            transform: rotateX(90deg);
        }

        .flip-link:last-of-type .flip-back {
            color: #fbbf24;
        }

        @media (max-width: 640px) {
            .flip-inner {
                height: 2rem;
            }
            .flip-front, .flip-back {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body class="text-white">
    <!-- Animated background blobs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-80 h-80 bg-blue-500/10 rounded-full blur-3xl pulse-slow"></div>
        <div class="absolute top-1/2 -left-40 w-80 h-80 bg-purple-500/10 rounded-full blur-3xl pulse-slow" style="animation-delay: 1s;"></div>
        <div class="absolute -bottom-40 right-1/3 w-80 h-80 bg-amber-500/5 rounded-full blur-3xl pulse-slow" style="animation-delay: 2s;"></div>
    </div>

    <!-- Main content -->
    <div class="relative z-10 flex flex-col items-center justify-center min-h-screen px-4 py-6 sm:py-12">
        
        <!-- Header with Logo -->
        <div class="mb-12 text-center fade-in-up w-full">
            <!-- Logo -->
            <div class="mb-6">
                <img src="logo.png" alt="Bear Media" class="w-24 h-24 sm:w-32 sm:h-32 mx-auto rounded-full shadow-2xl object-cover border-2 border-amber-500/20">
            </div>
            <h1 class="text-3xl sm:text-4xl font-bold mb-2 tracking-tight">
                Bear Media
            </h1>
            <div class="h-1 w-14 bg-gradient-to-r from-amber-400 via-amber-500 to-orange-500 mx-auto rounded-full mb-4"></div>
            <p class="text-gray-400 text-xs sm:text-sm font-light max-w-sm mx-auto">Content Creator • Web Design</p>
        </div>

        <!-- Links container -->
        <div class="w-full flex flex-col items-center space-y-4 mb-8 max-w-sm">
            
            <!-- Instagram -->
            <a href="https://www.instagram.com/bearmedia70/" target="_blank" rel="noopener noreferrer" class="flip-link w-full">
                <div class="flip-inner">
                    <div class="flip-front">Instagram</div>
                    <div class="flip-back">Instagram</div>
                </div>
            </a>

            <!-- TikTok -->
            <a href="https://www.tiktok.com/@bearmediascotland" target="_blank" rel="noopener noreferrer" class="flip-link w-full">
                <div class="flip-inner">
                    <div class="flip-front">TikTok</div>
                    <div class="flip-back">TikTok</div>
                </div>
            </a>

            <!-- YouTube -->
            <a href="https://www.youtube.com/@bearmedia70" target="_blank" rel="noopener noreferrer" class="flip-link w-full">
                <div class="flip-inner">
                    <div class="flip-front">YouTube</div>
                    <div class="flip-back">YouTube</div>
                </div>
            </a>

            <!-- LinkedIn -->
            <a href="https://www.linkedin.com/in/garrylynch70/" target="_blank" rel="noopener noreferrer" class="flip-link w-full">
                <div class="flip-inner">
                    <div class="flip-front">LinkedIn</div>
                    <div class="flip-back">LinkedIn</div>
                </div>
            </a>

            <!-- Facebook -->
            <a href="https://www.facebook.com/profile.php?id=61553562716650" target="_blank" rel="noopener noreferrer" class="flip-link w-full">
                <div class="flip-inner">
                    <div class="flip-front">Facebook</div>
                    <div class="flip-back">Facebook</div>
                </div>
            </a>

            <!-- Website -->
            <a href="https://bear-media.com/" target="_blank" rel="noopener noreferrer" class="flip-link w-full">
                <div class="flip-inner">
                    <div class="flip-front">Website</div>
                    <div class="flip-back">Website</div>
                </div>
            </a>

            <!-- Discovery Call -->
            <a href="https://calendly.com/bearmedia/discovery-call" target="_blank" rel="noopener noreferrer" class="flip-link w-full mt-4">
                <div class="flip-inner">
                    <div class="flip-front text-amber-400">Discovery Call</div>
                    <div class="flip-back">Discovery Call</div>
                </div>
            </a>

        </div>

        <!-- Footer -->
        <div class="text-center text-gray-500 text-xs mt-8 w-full">
            <p>© 2026 Bear Media</p>
        </div>
    </div>

    <script>
        // Stagger fade-in animations
        const links = document.querySelectorAll('.flip-link');
        links.forEach((link, index) => {
            link.style.opacity = '0';
            link.style.animation = `fadeInUp 0.6s ease-out forwards`;
            link.style.animationDelay = `${0.1 + (index * 0.08)}s`;
        });
    </script>
</body>
</html>
